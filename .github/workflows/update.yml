name: Update Pinned Projects

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get pinned repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query($login: String!) { user(login: $login) { pinnedItems(first: 6, types: REPOSITORY) { nodes { ... on Repository { name nameWithOwner url } } } } }","variables":{"login":"Parsa3323"}}' \
            https://api.github.com/graphql)

          if echo "$response" | jq -e '.errors' >/dev/null; then
            echo "$response" | jq .
            exit 1
          fi

          echo "$response" | jq -r '.data.user.pinnedItems.nodes[] | [.name, .nameWithOwner, .url] | @tsv' > pinned.txt

          if [ ! -s pinned.txt ]; then
            echo "No pinned repositories were returned"
            exit 1
          fi

      - name: Update README
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          rows = []

          with open("pinned.txt", "r", encoding="utf-8") as file:
              for line in file:
                  name, name_with_owner, url = line.rstrip("\n").split("\t")
                  owner, repo = name_with_owner.split("/", 1)

                  rows.append(
                      f'''    <tr>
                <td>
                  <a href="{url}">
                    <b>{name}</b>
                  </a>
                </td>
                <td>
                  <img alt="Stars" src="https://img.shields.io/github/stars/{owner}/{repo}?style=flat-square&labelColor=343b41">
                </td>
                <td>
                  <img alt="Forks" src="https://img.shields.io/github/forks/{owner}/{repo}?style=flat-square&labelColor=343b41">
                </td>
                <td>
                  <img alt="Issues" src="https://img.shields.io/github/issues/{owner}/{repo}?style=flat-square&labelColor=343b41">
                </td>
                <td>
                  <img alt="Pull Requests" src="https://img.shields.io/github/issues-pr/{owner}/{repo}?style=flat-square&labelColor=343b41">
                </td>
              </tr>'''
                  )

          now = datetime.now(timezone.utc)

          next_run = now.replace(
              minute=0,
              second=0,
              microsecond=0
          )

          hours_until_next = 3 - (next_run.hour % 3)

          if hours_until_next == 0:
              hours_until_next = 3

          next_run += timedelta(hours=hours_until_next)

          generated = now.strftime("%B %d, %Y at %H:%M UTC")
          next_generation = next_run.strftime("%B %d, %Y at %H:%M UTC")

          timestamp = f'''<p align="center">
            Last generated: {generated} · Next generation: {next_generation}
          </p>'''

          table = f'''<h3>Open source projects</h3>

          <table>
            <thead align="center">
              <tr>
                <td><b>Projects</b></td>
                <td><b>Stars</b></td>
                <td><b>Forks</b></td>
                <td><b>Issues</b></td>
                <td><b>Pull requests</b></td>
              </tr>
            </thead>
            <tbody>
          {"".join(rows)}
            </tbody>
          </table>'''

          start_marker = "<!-- PINNED_PROJECTS_START -->"
          end_marker = "<!-- PINNED_PROJECTS_END -->"

          if start_marker not in readme or end_marker not in readme:
              raise SystemExit(
                  "README.md must contain PINNED_PROJECTS_START and PINNED_PROJECTS_END markers"
              )

          start = readme.index(start_marker) + len(start_marker)
          end = readme.index(end_marker)

          generated_content = f'''

          {timestamp}

          {table}

          '''

          readme = (
              readme[:start]
              + generated_content
              + readme[end:]
          )

          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update pinned projects"
          git push