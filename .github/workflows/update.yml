name: Update Pinned Repositories

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get pinned repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query($login: String!) { user(login: $login) { pinnedItems(first: 6, types: REPOSITORY) { nodes { ... on Repository { name nameWithOwner url } } } } }","variables":{"login":"Parsa3323"}}' \
            https://api.github.com/graphql)

          if echo "$response" | jq -e '.errors' >/dev/null; then
            echo "$response" | jq .
            exit 1
          fi

          echo "$response" | jq -r '.data.user.pinnedItems.nodes[] | [.name, .nameWithOwner, .url] | @tsv' > pinned.txt

          if [ ! -s pinned.txt ]; then
            echo "No pinned repositories were returned"
            exit 1
          fi

      - name: Update README
        run: |
          python3 <<'PY'
          from pathlib import Path

          readme = Path("README.md").read_text()

          rows = []

          with open("pinned.txt", "r", encoding="utf-8") as file:
              for line in file:
                  name, name_with_owner, url = line.rstrip("\n").split("\t")
                  owner, repo = name_with_owner.split("/", 1)

                  rows.append(
                      f'''    <tr>
                <td>
                  <a href="{url}">
                    <b>{name}</b>
                  </a>
                </td>
                <td>
                  <img alt="Stars" src="https://img.shields.io/github/stars/{owner}/{repo}?style=flat-square&labelColor=343b41">
                </td>
                <td>
                  <img alt="Forks" src="https://img.shields.io/github/forks/{owner}/{repo}?style=flat-square&labelColor=343b41">
                </td>
                <td>
                  <img alt="Issues" src="https://img.shields.io/github/issues/{owner}/{repo}?style=flat-square&labelColor=343b41">
                </td>
                <td>
                  <img alt="Pull Requests" src="https://img.shields.io/github/issues-pr/{owner}/{repo}?style=flat-square&labelColor=343b41">
                </td>
              </tr>'''
                  )

          table = """<h3>Open source projects</h3>

          <table>
            <thead align="center">
              <tr>
                <td><b>Projects</b></td>
                <td><b>Stars</b></td>
                <td><b>Forks</b></td>
                <td><b>Issues</b></td>
                <td><b>Pull requests</b></td>
              </tr>
            </thead>
            <tbody>
          """ + "\n".join(rows) + """
            </tbody>
          </table>"""

          start_marker = "<!-- PINNED_PROJECTS_START -->"
          end_marker = "<!-- PINNED_PROJECTS_END -->"

          if start_marker in readme and end_marker in readme:
              start = readme.index(start_marker) + len(start_marker)
              end = readme.index(end_marker)

              readme = (
                  readme[:start]
                  + "\n\n"
                  + table
                  + "\n\n"
                  + readme[end:]
              )
          else:
              section = "## My projects\n\n" + start_marker + "\n\n" + table + "\n\n" + end_marker

              if "## My projects" in readme:
                  start = readme.index("## My projects")
                  next_section = readme.find("\n## ", start + len("## My projects"))

                  if next_section == -1:
                      readme = readme[:start] + section + "\n"
                  else:
                      readme = readme[:start] + section + readme[next_section:]
              else:
                  readme += "\n\n" + section + "\n"

          Path("README.md").write_text(readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update pinned repositories"
          git push