name: Update Pinned Projects

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Generate App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PARSA_MANAGER_APP_ID }}
          private-key: ${{ secrets.PARSA_MANAGER_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Get pinned repositories
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          response=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"query($login: String!) { user(login: $login) { pinnedItems(first: 6, types: REPOSITORY) { nodes { ... on Repository { name nameWithOwner url } } } } }","variables":{"login":"Parsa3323"}}' \
            https://api.github.com/graphql)

          if echo "$response" | jq -e '.errors' >/dev/null; then
            echo "$response" | jq .
            exit 1
          fi

          echo "$response" | jq -r '.data.user.pinnedItems.nodes[] | [.name, .nameWithOwner, .url] | @tsv' > pinned.txt

          if [ ! -s pinned.txt ]; then
            echo "No pinned repositories found"
            exit 1
          fi

      - name: Update README
        run: |
          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          import re

          path = Path("README.md")
          readme = path.read_text(encoding="utf-8")

          table_start = "<!-- PINNED_PROJECTS_START -->"
          table_end = "<!-- PINNED_PROJECTS_END -->"

          readme = readme.replace(r"\<!-- PINNED_PROJECTS_START -->", table_start)
          readme = readme.replace(r"\<!-- PINNED_PROJECTS_END -->", table_end)

          starts = [m.start() for m in re.finditer(re.escape(table_start), readme)]
          ends = [m.start() for m in re.finditer(re.escape(table_end), readme)]

          if not starts or not ends:
              raise SystemExit("Pinned project markers are missing")

          start = starts[0]
          end = next((pos for pos in ends if pos > start), None)

          if end is None:
              raise SystemExit("Pinned project end marker is missing")

          rows = []

          with open("pinned.txt", encoding="utf-8") as file:
              for line in file:
                  name, full_name, url = line.rstrip("\n").split("\t")
                  owner, repo = full_name.split("/", 1)

                  rows.append(f"""    <tr>
                <td>
                  <a href="{url}">
                    <b>{name}</b>
                  </a>
                </td>
                <td>
                  <img alt="Stars" src="https://img.shields.io/github/stars/{owner}/{repo}?style=flat-square&labelColor=343b41">
                </td>
                <td>
                  <img alt="Forks" src="https://img.shields.io/github/forks/{owner}/{repo}?style=flat-square&labelColor=343b41">
                </td>
                <td>
                  <img alt="Issues" src="https://img.shields.io/github/issues/{owner}/{repo}?style=flat-square&labelColor=343b41">
                </td>
                <td>
                  <img alt="Pull Requests" src="https://img.shields.io/github/issues-pr/{owner}/{repo}?style=flat-square&labelColor=343b41">
                </td>
              </tr>""")

          table = f"""<table>
            <thead align="center">
              <tr>
                <td><b>Projects</b></td>
                <td><b>Stars</b></td>
                <td><b>Forks</b></td>
                <td><b>Issues</b></td>
                <td><b>Pull requests</b></td>
              </tr>
            </thead>
            <tbody>
          {"".join(rows)}
            </tbody>
          </table>"""

          readme = (
              readme[:start]
              + table_start
              + "\n\n"
              + table
              + "\n\n"
              + table_end
              + readme[end + len(table_end):]
          )

          timestamp_pattern = re.compile(
              r'<p align="center">\s*'
              r'Last generated:.*?'
              r'(?:<br\s*/?>\s*|\n\s*)?'
              r'Next generation:.*?'
              r'</p>',
              re.DOTALL
          )

          now = datetime.now(timezone.utc)

          next_run = now.replace(
              minute=0,
              second=0,
              microsecond=0
          )

          while next_run <= now or next_run.hour % 3 != 0:
              next_run += timedelta(hours=1)

          generated = now.strftime("%B %d, %Y at %H:%M UTC")
          next_generation = next_run.strftime("%B %d, %Y at %H:%M UTC")

          timestamp = f"""<p align="center">
            Last generated: {generated}<br>
            Next generation: {next_generation}
          </p>"""

          readme = timestamp_pattern.sub("", readme)

          badge_pattern = re.compile(
              r'<p align="center">\s*'
              r'<a href="https://github\.com/Parsa3323/Parsa3323/actions/workflows/update\.yml">\s*'
              r'<img[^>]*actions/workflows/update\.yml/badge\.svg[^>]*>\s*'
              r'</a>\s*'
              r'</p>',
              re.DOTALL
          )

          readme = badge_pattern.sub("", readme)

          readme = readme.rstrip()

          badge = """<p align="center">
            <a href="https://github.com/Parsa3323/Parsa3323/actions/workflows/update.yml">
              <img src="https://github.com/Parsa3323/Parsa3323/actions/workflows/update.yml/badge.svg" alt="Update Pinned Projects">
            </a>
          </p>"""

          readme = readme + "\n\n" + timestamp + "\n\n" + badge + "\n"

          path.write_text(readme, encoding="utf-8")
          PY

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: "parsa-s-manager[bot]"
          GIT_AUTHOR_EMAIL: "${{ secrets.PARSA_MANAGER_APP_ID }}+parsa-s-manager[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "parsa-s-manager[bot]"
          GIT_COMMITTER_EMAIL: "${{ secrets.PARSA_MANAGER_APP_ID }}+parsa-s-manager[bot]@users.noreply.github.com"
        run: |
          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update pinned projects"
          git push